<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="serlinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9d174d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect width="128" height="128" rx="36" fill="url(#serlinGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="124" height="124" rx="34" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>

  <!-- Centered Bold 'S' Monogram -->
  <text x="56" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" letter-spacing="-2">S</text>

  <!-- Cute Sparkling Star ✦ (top-right) -->
  <path d="M 94 22 Q 94 34 106 34 Q 94 34 94 46 Q 94 34 82 34 Q 94 34 94 22 Z" fill="url(#starGrad)"/>

  <!-- Accent Dot '.' next to the S -->
  <circle cx="94" cy="84" r="6.5" fill="#fecdd3"/>
</svg>
